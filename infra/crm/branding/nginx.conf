server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (desabilitado no index.html para sub_filter atuar com segurança)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers — frame-src liberado para app.phonecenter.tech (Dashboard App lateral!)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https://*.facebook.com https://app.phonecenter.tech https://*.phonecenter.tech; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Assets de branding PhoneCenterCRM servidos diretamente de /etc/phonecenter-branding/
    location = /phonecenter-theme.css {
        alias /etc/phonecenter-branding/phonecenter-theme.css;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /phonecenter-brand.js {
        alias /etc/phonecenter-branding/phonecenter-brand.js;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /phonecenter-logo.png {
        alias /etc/phonecenter-branding/phonecenter-logo.png;
        expires 7d;
    }
    location = /phonecenter-logo-full.png {
        alias /etc/phonecenter-branding/phonecenter-logo-full.png;
        expires 7d;
    }
    location = /phonecenter-favicon.png {
        alias /etc/phonecenter-branding/phonecenter-favicon.png;
        expires 7d;
    }

    # Substitui logo.svg, favicon.svg e hover-evolution.png diretamente no nível HTTP
    location = /favicon.svg {
        alias /etc/phonecenter-branding/phonecenter-favicon.png;
        default_type image/png;
        expires 7d;
    }
    location = /hover-evolution.png {
        alias /etc/phonecenter-branding/phonecenter-logo-full.png;
        default_type image/png;
        expires 7d;
    }

    # Widget route must be embeddable in customer websites (iframe).
    location = /widget {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA routing + injeção limpa do tema e script PhoneCenterCRM no index.html
    location / {
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '<title>Evo CRM</title>' '<title>PhoneCenterCRM — Central de Atendimento &amp; Vendas</title><link rel="icon" type="image/png" href="/phonecenter-favicon.png" /><link rel="stylesheet" href="/phonecenter-theme.css" /><script defer src="/phonecenter-brand.js"></script>';
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
